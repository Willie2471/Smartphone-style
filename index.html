<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WS Lawn Care Start Page</title>
<style>
  :root { --green:#21A348; --dark-green:#14702F; --ink:#14201A; --muted:#3C4A41; --bg:#F3F6F1; --tile:#DCEFE1; --line:#D5DED4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  a, a:hover, a:focus, a:visited { text-decoration: none !important; color: inherit !important; }
  .phone { max-width: 440px; min-height: 100vh; margin: 0 auto; padding: 48px 24px 24px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .hello { font-size: 22px; font-weight: 600; color: var(--dark-green); }
  .avatar { display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #E6EBE4; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar:hover, .avatar:focus-visible { box-shadow: 0 0 0 3px rgba(33,163,72,.35); }
  .time { display: flex; align-items: baseline; gap: 8px; }
  .time .hm { font-size: 96px; font-weight: 300; letter-spacing: -5px; line-height: 1; }
  .time .ap { font-size: 22px; font-weight: 500; color: var(--muted); }
  .date { font-size: 20px; font-weight: 500; margin-top: 4px; }
  .weather { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 16px; color: var(--muted); }
  .weather strong { color: var(--ink); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 8px; margin-top: 36px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .app .ico { width: 60px; height: 60px; border-radius: 50%; background: var(--tile); display: flex; align-items: center; justify-content: center; }
  .app .ico img { width: 36px; height: 36px; object-fit: contain; }
  .app .ico svg { width: 28px; height: 28px; }
  .app span { font-size: 12px; font-weight: 500; text-align: center; line-height: 1.2; }
  .app:hover .ico, .app:focus-visible .ico, .dock a:hover, .dock a:focus-visible { box-shadow: 0 0 0 3px rgba(33,163,72,.35); }
  .app { position: relative; }
  .app .ico { position: relative; }
  .app .bdg { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #E5352B; color: #fff; font-size: 12px; font-weight: 700; line-height: 22px; text-align: center; box-shadow: 0 0 0 2px #F3F5F1; display: none; z-index: 2; }
  .app.has-new .bdg { display: block; }
  .app.has-new .ico { background: #CFEFD8; box-shadow: 0 0 0 3px #21A348; animation: wsPulse 2s ease-in-out infinite; }
  @keyframes wsPulse { 0%,100% { box-shadow: 0 0 0 3px #21A348; } 50% { box-shadow: 0 0 0 7px rgba(33,163,72,.25); } }
  @media (prefers-reduced-motion: reduce) { .app.has-new .ico { animation: none; } }
  .grid-out { margin-top: 22px; }
  .dock { display: flex; justify-content: space-around; margin-top: 22px; padding: 0 0 20px; }
  .dock a { width: 60px; height: 60px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .dock svg { width: 28px; height: 28px; }
  main > form { margin-top: 28px; }
  form { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 999px; height: 56px; padding: 0 20px; }
  form input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>

<main class="phone">
  <div>
    <div class="topbar">

    </div>
    <div class="time"><span class="hm" id="hm">--:--</span><span class="ap" id="ap"></span></div>

  function svg(d) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#14702F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"></path></svg>';
  }
  // In-house apps open in the same window (the avatar button brings the user back to the menu).
  // Outside apps open in a new tab. Phone/text/mail links go to the device's own app.
  function link(a) {
    if (a.href === '#' || /^(tel|sms|mailto):/.test(a.href)) return 'href="' + a.href + '"';
    return 'href="' + a.href + '" target="' + (a.inhouse ? '_top' : '_blank') + '" rel="noopener"';
  }
  function tile(a) {
    var ico = a.img ? '<img src="' + a.img + '" alt="">' : svg(a.d);
    return '<a class="app" data-app="' + a.name + '" ' + link(a) + '><div class="ico">' + ico + '<b class="bdg" aria-hidden="true"></b></div><span>' + a.name + '</span></a>';
  }
  document.getElementById('apps').innerHTML = APPS.filter(function (a) { return a.inhouse; }).map(tile).join('');
  document.getElementById('apps-out').innerHTML = APPS.filter(function (a) { return !a.inhouse; }).map(tile).join('');

  }).join('');

  (function () {

      em.setAttribute('href', 'googlegmail:///');

      document.getElementById('cond').textContent = 'Titusville, FL';
    });
  }
  weather(); setInterval(weather, 15 * 60 * 1000);
})();

    var now = new Date();
    if (i.unit === 'hours') { var rem = ((i.lastHours || 0) + i.freq) - (e.hours || 0); return rem <= 0 ? 'overdue' : (rem <= i.freq * .2 ? 'due' : 'ok'); }
    if (i.unit === 'miles') { var rem2 = ((i.lastMiles || 0) + i.freq) - (e.miles || 0); return rem2 <= 0 ? 'overdue' : (rem2 <= i.freq * .2 ? 'due' : 'ok'); }
    var ld = i.lastDone ? new Date(i.lastDone) : new Date(e.purchaseDate || '2024-01-01'), dd = new Date(ld);
    if (i.unit === 'days') dd.setDate(dd.getDate() + i.freq);
    else if (i.unit === 'months') dd.setMonth(dd.getMonth() + i.freq);
    else if (i.unit === 'years') dd.setFullYear(dd.getFullYear() + i.freq);
    var diff = Math.round((dd - now) / 864e5);
    return diff < 0 ? 'overdue' : (diff <= 30 ? 'due' : 'ok');
  }
  function eqOverdue(e) { return (e.intervals || []).some(function (i) { return iStat(e, i) === 'overdue'; }); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dayStr(v) { return String(v || '').slice(0, 10); }

  function paint() {
    var s = svc || 0, p = sup || 0, n = s + p;
    tiles.forEach(function (t) {
      var b = t.querySelector('.bdg');
      t.classList.toggle('is-overdue', n > 0);
      if (b) b.textContent = n > 9 ? '9+' : String(n);
      var parts = [];
      if (s) parts.push(s + ' overdue service' + (s === 1 ? '' : 's'));
      if (p) parts.push(p + ' overdue suppl' + (p === 1 ? 'y' : 'ies'));
      var label = parts.length ? base + ', ' + parts.join(', ') : base;
      t.setAttribute('aria-label', label);
      if (parts.length) t.title = label; else t.removeAttribute('title');
    });
  }
  function get(action) {
    return fetch(API + '?action=' + action + '&t=' + Date.now(), { redirect: 'follow' }).then(function (r) { return r.json(); });
  }
  function check() {
    get('getAll').then(function (d) {
      if (d && d.ok) { svc = (d.equipment || []).filter(eqOverdue).length; paint(); }
    }).catch(function () { /* offline: keep what is showing */ });
    get('getSupplies').then(function (r) {
      if (!(r && r.ok && Array.isArray(r.supplies))) return;
      var t = today(), items = r.supplies.filter(function (x) { return x && x.kind !== 'staple' && x.kind !== 'store'; });
      var open = items.filter(function (x) { return x.status !== 'picked'; });
      var late = open.filter(function (x) { var d = dayStr(x.due); return d && d < t; }).length;
      // A repeat order whose reminder date has passed counts too, until it turns into an order in the portal.
      r.supplies.forEach(function (s) {
        if (!s || s.kind !== 'staple' || !s.repeatEvery) return;
        var nd = dayStr(s.nextDue);
        if (!nd || nd >= t) return;
        if (open.some(function (i) { return String(i.stapleId) === String(s.id); })) return;
        late++;
      });
      sup = late; paint();
    }).catch(function () { /* offline: keep what is showing */ });
  }
  check();
  setInterval(check, POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>

<div class="ask-back" id="askBack" role="dialog" aria-modal="true" aria-labelledby="askTitle">
  <div class="ask-sheet">
    <div class="ask-head"><h2 id="askTitle">Ask Gemini</h2><button class="ask-close" id="askClose" type="button">Close</button></div>
    <div class="ask-log" id="askLog" aria-live="polite"></div>
    <div class="ask-form"><input id="askIn" type="text" placeholder="Ask a follow-up…" autocomplete="off" enterkeyhint="send" aria-label="Your question"><button id="askSend" type="button">Send</button></div>
  </div>
</div>
<script>
(function () {
  // After you set up the Apps Script (ws-ask-gemini.gs), paste its /exec address and your password here.
  var ASK_URL = 'https://script.google.com/macros/s/AKfycbyQgD6kvELgMQm14VkmMVIhqouWJuz8bQ0c04Q1tvd6tRUk8pZXRLDJfUWOhDKHg5LmKg/exec';
  var ASK_KEY = 'wsask-ItrustGod51';

  var form = document.querySelector('main form'), q = document.getElementById('q');
  var back = document.getElementById('askBack'), log = document.getElementById('askLog');
  var inp = document.getElementById('askIn'), send = document.getElementById('askSend');
  if (!form || !q || !back) return;
  var hist = [], busy = false, pushed = false;

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  // Plain-text renderer: **bold**, "- " / "* " bullets, line breaks. Everything is inserted as text, never as HTML.
  function fill(node, text) {
    String(text).replace(/\r/g, '').split('\n').forEach(function (line, i) {
      if (i) node.appendChild(document.createElement('br'));
      line = line.replace(/^\s*[-*]\s+/, '• ').replace(/^#+\s*/, '');
      line.split(/\*\*(.+?)\*\*/g).forEach(function (part, k) {
        if (!part) return;
        if (k % 2) { var b = document.createElement('b'); b.textContent = part; node.appendChild(b); }
        else node.appendChild(document.createTextNode(part.replace(/\*/g, '')));
      });
    });
  }
  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function openSheet() {
    if (!back.classList.contains('show')) {
      back.classList.add('show');
      try { history.pushState({ ask: 1 }, ''); pushed = true; } catch (e) { pushed = false; }
    }
  }
  function hideSheet() { back.classList.remove('show'); }
  function closeSheet() {
    if (!back.classList.contains('show')) return;
    if (pushed) { pushed = false; try { history.back(); return; } catch (e) {} }
    hideSheet();
  }
  window.addEventListener('popstate', function () { pushed = false; hideSheet(); });   // phone back button
  document.getElementById('askClose').addEventListener('click', closeSheet);
  back.addEventListener('pointerdown', function (e) { if (e.target === back) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function ask(text) {
    if (busy) return;
    busy = true; send.disabled = true;
    log.appendChild(el('div', 'ask-q', text));
    var wait = el('div', 'ask-a wait', 'Thinking…'); log.appendChild(wait); scrollDown();
    fetch(ASK_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: ASK_KEY, q: text, h: hist.slice(-3) })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || 'No answer came back.');
      wait.className = 'ask-a'; wait.textContent = ''; fill(wait, j.answer);
      if (j.sources && j.sources.length) {
        var s = el('div', 'ask-src', 'Sources: ');
        j.sources.forEach(function (x) {
          if (!/^https?:\/\//i.test(x.uri)) return;
          var a = el('a', '', x.title); a.href = x.uri; a.target = '_blank'; a.rel = 'noopener'; s.appendChild(a);
        });
        wait.appendChild(s);
      }
      hist.push({ q: text, a: String(j.answer).slice(0, 1000) });
    }).catch(function (e) {
      wait.className = 'ask-a err';
      wait.textContent = (e && e.message && e.message !== 'Failed to fetch') ? e.message : 'Could not reach Gemini. Check your signal and try again.';
    }).then(function () {
      if (!log.querySelector('.ask-note')) log.appendChild(el('div', 'ask-note', 'A quick guide only. Check the product label or equipment manual for anything safety-related.'));
      busy = false; send.disabled = false; scrollDown();
    });
  }

  // Search box on the start page: with ASK_URL set it opens this sheet; without it, it opens Google's AI Mode in a new tab.
  form.addEventListener('submit', function (e) {
    if (!ASK_URL) return;
    e.preventDefault();
    var t = q.value.trim(); if (!t) return;
    q.value = ''; openSheet(); ask(t);
  });
  function followUp() { var t = inp.value.trim(); if (!t) return; inp.value = ''; ask(t); }
  send.addEventListener('click', followUp);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); followUp(); } });
})();
</script>
<!-- ===== end Ask Gemini sheet ===== -->

<!-- Staff Hub unread badge: reads the same Firebase project and sign-in as the Staff Hub (same github.io origin). Fails silently. -->
<script src="https://willie2471.github.io/ws-staff-hub/config.js"></script>
<script type="module">
(async function () {
  try {
    var cfg = window.FIREBASE_CONFIG;
    if (!cfg || !cfg.apiKey || String(cfg.apiKey).indexOf('PASTE') === 0) return;
    var V = 'https://www.gstatic.com/firebasejs/10.14.1/';
    var A = await import(V + 'firebase-app.js');
    var AU = await import(V + 'firebase-auth.js');
    var F = await import(V + 'firebase-firestore.js');
    var app = A.initializeApp(cfg);
    var auth = AU.getAuth(app);
    var db = F.getFirestore(app);

    var tile = document.querySelector('.app[data-app="Staff Hub"]');
    if (!tile) return;
    var bdg = tile.querySelector('.bdg');
    var base = tile.getAttribute('aria-label') || 'Staff Hub';
    var convs = {}, unsubs = [];
    var ms = function (v) { return (v && v.toMillis) ? v.toMillis() : (v ? +v : 0); };

    function paint(me) {
      var n = 0;
      Object.keys(convs).forEach(function (id) {
        var c = convs[id];
        // same rule the Staff Hub uses: last message is from someone else and newer than my last-read time
        if (!c.archived && c.lastMessageBy && c.lastMessageBy !== me &&
            ms(c.lastMessageAt) > ms(c.lastRead && c.lastRead[me])) n++;
      });
      bdg.textContent = n > 9 ? '9+' : String(n);
      tile.classList.toggle('has-new', n > 0);
      tile.setAttribute('aria-label', n ? base + ', ' + n + ' with new messages' : base);
    }
    function stop() { unsubs.forEach(function (u) { u(); }); unsubs = []; convs = {}; }

    AU.onAuthStateChanged(auth, function (user) {
      stop();
      if (!user) { tile.classList.remove('has-new'); return; }
      var me = user.uid;
      [F.query(F.collection(db, 'conversations'), F.where('members', 'array-contains', me)),
       F.query(F.collection(db, 'conversations'), F.where('everyone', '==', true))].forEach(function (q) {
        unsubs.push(F.onSnapshot(q, function (snap) {
          snap.docChanges().forEach(function (ch) {
            if (ch.type === 'removed') delete convs[ch.doc.id]; else convs[ch.doc.id] = ch.doc.data();
          });
          paint(me);
        }, function () {}));
      });
    });
    window.addEventListener('pagehide', stop);
  } catch (e) { /* badge is optional - never break the start page */ }
})();
</script>
