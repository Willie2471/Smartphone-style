<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WS Lawn Care Start Page</title>
<style>
  :root { --green:#21A348; --dark-green:#14702F; --ink:#14201A; --muted:#3C4A41; --bg:#F3F6F1; --tile:#DCEFE1; --line:#D5DED4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  a { text-decoration: none; color: inherit; }
  .phone { max-width: 440px; min-height: 100vh; margin: 0 auto; padding: 48px 24px 24px; display: flex; flex-direction: column; }
  .hello { font-size: 22px; font-weight: 600; color: var(--dark-green); margin-bottom: 6px; }
  .time { display: flex; align-items: baseline; gap: 8px; }
  .time .hm { font-size: 96px; font-weight: 300; letter-spacing: -5px; line-height: 1; }
  .time .ap { font-size: 22px; font-weight: 500; color: var(--muted); }
  .date { font-size: 20px; font-weight: 500; margin-top: 4px; }
  .weather { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 16px; color: var(--muted); }
  .weather strong { color: var(--ink); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 8px; margin-top: 36px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .app .ico { width: 60px; height: 60px; border-radius: 50%; background: var(--tile); display: flex; align-items: center; justify-content: center; }
  .app .ico img { width: 36px; height: 36px; object-fit: contain; }
  .app .ico svg { width: 28px; height: 28px; }
  .app span { font-size: 12px; font-weight: 500; text-align: center; line-height: 1.2; }
  .app:hover .ico, .app:focus-visible .ico, .dock a:hover, .dock a:focus-visible { box-shadow: 0 0 0 3px rgba(33,163,72,.35); }
  .dots { display: flex; justify-content: center; gap: 8px; margin-top: auto; padding: 24px 0 16px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #B9C7BB; display: block; }
  .dots i:first-child { background: var(--green); }
  .dock { display: flex; justify-content: space-around; padding-bottom: 16px; }
  .dock a { width: 60px; height: 60px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .dock svg { width: 28px; height: 28px; }
  form { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 999px; height: 56px; padding: 0 20px; }
  form input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main class="phone">
  <div>
    <div class="hello" id="hello">Good {{friendlyTimeOfDay}} {{clientFirstName}}</div>
    <div class="time"><span class="hm" id="hm">--:--</span><span class="ap" id="ap"></span></div>
    <div class="date" id="date"></div>
    <div class="weather">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#21A348" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path></svg>
      <strong id="temp">--°</strong>
      <span id="cond">Loading weather…</span>
    </div>
  </div>

  <nav class="grid" id="apps" aria-label="Apps"></nav>

  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>

  <nav class="dock" id="dock" aria-label="Quick actions"></nav>

  <form action="https://www.google.com/search" method="get" target="_blank">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3C4A41" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
    <label class="sr" for="q">Search</label>
    <input id="q" name="q" type="text" placeholder="Search or type a URL">
  </form>
</main>

  if (hello.textContent.indexOf('{' + '{') !== -1) {
    var h = parseInt(new Date().toLocaleTimeString('en-US', { hour:'numeric', hour12:false, timeZone:TZ }), 10) % 24;
    hello.textContent = 'Good ' + (h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening');
  }

  // ---- Clock ----
  function tick() {
    var d = new Date();
    var t = d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true, timeZone:TZ }).split(' ');
    document.getElementById('hm').textContent = t[0];
    document.getElementById('ap').textContent = t[1] || '';
    document.getElementById('date').textContent = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', timeZone:TZ });
  }
  tick(); setInterval(tick, 1000);

  // ---- Live weather (Open-Meteo, free, no key) ----
  var CODES = { 0:'Clear', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast', 45:'Fog', 48:'Fog', 51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
    61:'Light rain', 63:'Rain', 65:'Heavy rain', 80:'Showers', 81:'Showers', 82:'Heavy showers', 95:'Thunderstorms', 96:'Thunderstorms', 99:'Thunderstorms' };
  function weather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=1';
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var c = j.current, d = j.daily;
      document.getElementById('temp').textContent = Math.round(c.temperature_2m) + '°';
      document.getElementById('cond').textContent = (CODES[c.weather_code] || 'Weather') +
        ' · H ' + Math.round(d.temperature_2m_max[0]) + '° L ' + Math.round(d.temperature_2m_min[0]) + '°';
    }).catch(function () {
      document.getElementById('temp').textContent = '';
      document.getElementById('cond').textContent = 'Titusville, FL';
    });
  }
  weather(); setInterval(weather, 15 * 60 * 1000);
})();
</script>
</body>
</html>
